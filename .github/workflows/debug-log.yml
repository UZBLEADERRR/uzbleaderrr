name: Debug bot log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Botni ishga tushirish va log saqlash
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: timeout 60 node bot.js > run.log 2>&1 || true

      - name: Logni repoga saqlash
        run: |
          git config user.name "daho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add run.log
          git diff --staged --quiet || git commit -m "add debug run.log [skip ci]"
          git push
